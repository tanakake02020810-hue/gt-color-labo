<!doctype html><html lang="ja"><head><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><meta name="theme-color" content="#091321"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GT COLOR LAB | 配合計算</title><style>:root{color-scheme:dark;--bg:#091321;--panel:#132238;--line:#31425a;--gold:#e9bd79;--txt:#f5f7fa;--muted:#aebdd0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3450,var(--bg) 65%);color:var(--txt);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}main{max-width:880px;margin:auto;padding:28px 18px 60px}.eyebrow{color:var(--gold);letter-spacing:.23em;font-size:12px;font-weight:700}h1{font-size:clamp(30px,6vw,46px);margin:5px 0}p{color:var(--muted)}.panel{background:rgba(19,34,56,.95);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 12px 30px #0002}.top{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;color:#d8e3f1;font-size:14px;margin-bottom:9px}input,select{width:100%;background:#09182a;color:white;border:1px solid #53657c;border-radius:13px;padding:14px;font-size:22px;min-height:56px;font-weight:700}input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}select{font-size:17px}.drug{display:grid;grid-template-columns:minmax(110px,1.5fr) minmax(110px,1fr) minmax(100px,1fr);gap:12px;align-items:end;border-bottom:1px solid #34445b;padding:16px 0}.drug:last-child{border:0}.drug strong{font-size:16px}.drug .name{color:var(--gold);padding-bottom:17px}.result{background:#09182a;border:1px solid #41536b;border-radius:13px;padding:13px;text-align:right}.result small{display:block;color:var(--muted);font-size:11px}.result b{font-size:26px;color:#fff}.total{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px;margin-top:18px}.total b{font-size:36px;color:var(--gold)}.hint{font-size:13px;line-height:1.8}.warning{color:#ffbc8e;font-size:14px;margin-top:12px;min-height:22px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button{flex:1;min-width:160px;min-height:52px;border-radius:13px;border:1px solid var(--gold);background:var(--gold);color:#132238;font-weight:800;font-size:16px;cursor:pointer}button.secondary{background:transparent;color:var(--gold)}@media(max-width:520px){.panel{padding:15px}.drug{grid-template-columns:1fr 1fr}.drug .name{grid-column:1/-1;padding:0}.drug .result{grid-column:1/-1}.top{gap:10px}input,select{font-size:18px}.result b{font-size:24px}}</style></head><body><main><div class="eyebrow">HAIRHOUSE GT · PROFESSIONAL TOOL</div><h1>COLOR LAB<span style="color:var(--gold)">.</span></h1><p>カラー剤の配合を、思い通りに。数字を変更するとすぐ再計算します。</p><section class="panel"><div class="top"><div><label for="total">仕上がり総量 (g)</label><input id="total" type="number" min="0" step="0.1" value="100" inputmode="decimal"></div><div><label for="count">薬剤数 (1〜10種)</label><input id="count" type="number" min="1" max="10" step="1" value="3" inputmode="numeric"></div></div><p class="hint">各薬剤を「対比」または「%」で指定。%指定の薬剤を先に総量から確保し、残りを対比指定の薬剤で分配します。</p></section><section class="panel"><div class="eyebrow">FORMULA SETTINGS</div><div id="drugs"></div></section><section class="panel"><div class="eyebrow">MIXING RESULT</div><div id="results"></div><div class="total"><span>配合合計</span><b id="sum">100.0 g</b></div><div class="warning" id="warning" role="status"></div><div class="actions"><button id="copy">配合結果をコピー</button><button class="secondary" id="reset">初期値に戻す</button></div></section><p class="hint">※「%」は完成総量に対する割合です。例：総量100g、対比3：2、添加10% → 54g・36g・10g。オキシは別計算です。端数は最終薬剤で調整し、合計を一致させます。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let state=[{mode:'ratio',value:'3'},{mode:'ratio',value:'2'},{mode:'percent',value:'10'}];const number=v=>{const n=Number(v);return Number.isFinite(n)?Math.max(0,n):0};const fmt=n=>(Math.round(n*10)/10).toFixed(1);function syncCount(){const raw=Number($('count').value);if(!Number.isFinite(raw)||$('count').value==='')return;const count=Math.max(1,Math.min(10,Math.floor(raw)));while(state.length<count)state.push({mode:'ratio',value:'1'});state.length=count;renderInputs();calculate()};function renderInputs(){const root=$('drugs');root.replaceChildren();state.forEach((d,i)=>{const row=document.createElement('div');row.className='drug';const title=document.createElement('strong');title.className='name';title.textContent='薬剤 '+String(i+1).padStart(2,'0');const typeWrap=document.createElement('div');const typeLabel=document.createElement('label');typeLabel.textContent='指定方法';const type=document.createElement('select');[['ratio','対比'],['percent','%（総量比）']].forEach(([v,t])=>{const opt=document.createElement('option');opt.value=v;opt.textContent=t;type.append(opt)});type.value=d.mode;type.addEventListener('change',()=>{d.mode=type.value;calculate()});typeWrap.append(typeLabel,type);const valWrap=document.createElement('div');const valLabel=document.createElement('label');valLabel.textContent='数値';const val=document.createElement('input');val.type='number';val.min='0';val.step='any';val.inputMode='decimal';val.value=d.value;val.addEventListener('input',()=>{d.value=val.value;calculate()});valWrap.append(valLabel,val);row.append(title,typeWrap,valWrap);root.append(row)})};function calculate(){const total=number($('total').value);const percentSum=state.reduce((s,d)=>s+(d.mode==='percent'?number(d.value):0),0);const ratioSum=state.reduce((s,d)=>s+(d.mode==='ratio'?number(d.value):0),0);const percentAmount=total*percentSum/100;const remain=Math.max(0,total-percentAmount);const amounts=state.map(d=>d.mode==='percent'?total*number(d.value)/100:(ratioSum>0?remain*number(d.value)/ratioSum:0));const warning=[];if(percentSum>100)warning.push('%の合計が100%を超えています。配合を修正してください。');if(ratioSum===0&&percentSum<100)warning.push('残りの量を配分できません。対比指定を追加するか、%の合計を100%にしてください。');const valid=warning.length===0;const units=amounts.map(v=>Math.round(v*10));if(valid&&units.length){const target=Math.round(total*10);const delta=target-units.reduce((s,v)=>s+v,0);const adjustable=state.map((d,i)=>({d,i})).filter(x=>x.d.mode==='ratio'&&number(x.d.value)>0);const last=adjustable.length?adjustable[adjustable.length-1].i:units.length-1;units[last]+=delta}const root=$('results');root.replaceChildren();state.forEach((d,i)=>{const row=document.createElement('div');row.className='drug';const name=document.createElement('strong');name.className='name';name.textContent='薬剤 '+String(i+1).padStart(2,'0');const detail=document.createElement('span');detail.style.color='#aebdd0';detail.textContent=d.mode==='ratio'?'対比 '+(d.value||'0'):(d.value||'0')+'%';const box=document.createElement('div');box.className='result';const small=document.createElement('small');small.textContent='必要量';const big=document.createElement('b');big.textContent=valid?fmt(units[i]/10)+' g':'—';box.append(small,big);row.append(name,detail,box);root.append(row)});$('sum').textContent=valid?fmt(units.reduce((s,v)=>s+v,0)/10)+' g':'—';$('warning').textContent=warning.join(' ');$('copy').disabled=!valid;$('copy').dataset.text=valid?'総量 '+fmt(total)+'g\n'+state.map((d,i)=>'薬剤'+(i+1)+' ('+(d.mode==='ratio'?'対比 ':'')+d.value+(d.mode==='percent'?'%':'')+')：'+fmt(units[i]/10)+'g').join('\n'):''};$('total').addEventListener('input',calculate);$('count').addEventListener('input',syncCount);$('count').addEventListener('change',()=>{$('count').value=state.length;syncCount()});$('reset').addEventListener('click',()=>{$('total').value='100';$('count').value='3';state=[{mode:'ratio',value:'3'},{mode:'ratio',value:'2'},{mode:'percent',value:'10'}];renderInputs();calculate()});$('copy').addEventListener('click',async()=>{const txt=$('copy').dataset.text;try{await navigator.clipboard.writeText(txt);$('copy').textContent='コピーしました';setTimeout(()=>$('copy').textContent='配合結果をコピー',1500)}catch(e){const area=document.createElement('textarea');area.value=txt;document.body.append(area);area.select();document.execCommand('copy');area.remove()}});renderInputs();calculate()})();
</script></body></html>
